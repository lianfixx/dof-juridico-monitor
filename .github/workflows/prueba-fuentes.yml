name: Prueba de fuentes desde GitHub

# Prueba de factibilidad, a mano: comprueba si un servidor de GitHub puede bajar el DOF con los
# mismos scripts del box (scripts/box/dof_fuentes.py y paginas.py). Solo descarga publicaciones
# oficiales y públicas a una carpeta temporal que se borra al terminar; no guarda nada en el
# repositorio ni como artefacto, no usa ninguna llave y no lee ni redacta. En el registro solo
# quedan edición, número, páginas y SHA-256 de cada PDF, para cotejarlos con el manifiesto del box.
on:
  workflow_dispatch:
    inputs:
      fechas:
        description: "Fechas AAAA-MM-DD separadas por espacio"
        required: true
        default: "2026-10-30 2026-10-31 2026-11-01 2026-11-02 2026-11-03"
      sjf:
        description: "Viernes del Semanario a probar (AAAA-MM-DD); vacío para no probarlo"
        required: false
        default: "2026-10-30"

permissions:
  contents: read

jobs:
  fuentes:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
        with:
          persist-credentials: false
      - name: Herramientas
        run: sudo apt-get update -qq && sudo apt-get install -y -qq poppler-utils qpdf > /dev/null
      - name: Descargar y verificar
        env:
          FECHAS: ${{ inputs.fechas }}
          TZ: America/Mexico_City
        run: |
          set -uo pipefail
          D="$RUNNER_TEMP/fuentes/prueba/dof"; mkdir -p "$D"
          t0=$(date +%s)
          python3 scripts/box/dof_fuentes.py "$D" $FECHAS > "$RUNNER_TEMP/dof.log" 2>&1; rc=$?
          python3 scripts/box/paginas.py "$D" > /dev/null 2>&1 || true
          python3 - "$D" "$rc" "$(( $(date +%s) - t0 ))" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          d, rc, seg = sys.argv[1], sys.argv[2], sys.argv[3]
          p = os.path.join(d, "inventario.json")
          if not os.path.exists(p):
              print("SIN INVENTARIO: la descarga no produjo nada. Código", rc)
              sys.exit(1)
          inv = json.load(open(p))
          print("código", rc, "· segundos", seg, "· sin edición:", inv.get("sin_edicion"))
          total = 0
          for e in inv["ediciones"]:
              total += e.get("paginas_reales") or 0
              print(e["fecha"], e["edicion"], "núm.", e["numero"], "páginas", e["paginas_reales"], "declaradas", e["paginas_declaradas"],
                    "ok" if e["ok_paginas"] else "REVISAR", "ocr", len(e.get("paginas_ocr", [])), "anexos", len(e.get("anexos", [])), "sha256", e["sha256"])
              for a in e.get("anexos", []):
                  print("   anexo", a.get("sha256", a.get("error", "?")), a.get("paginas", ""))
          print("total de páginas:", total, "· errores:", len(inv.get("errores", [])))
          for x in inv.get("errores", []):
              print("   error", x.get("fecha"), x.get("edicion", ""), x.get("paso"), str(x.get("error"))[:160])
          sys.exit(1 if inv.get("errores") or not inv["ediciones"] else 0)
          PY
      - name: Semanario Judicial (misma vía del box, con Chrome)
        if: ${{ always() && inputs.sjf != '' }}
        env:
          SJF: ${{ inputs.sjf }}
          TZ: America/Mexico_City
        run: |
          set -uo pipefail
          W="$RUNNER_TEMP/sjf-prueba"; mkdir -p "$W" && cp scripts/box/sjf_fuentes.mjs "$W/" && cd "$W"
          npm init -y > /dev/null && npm install --silent puppeteer-core@24 > /dev/null 2>&1
          t0=$(date +%s)
          timeout 900 node sjf_fuentes.mjs "$W/sjf" "$SJF" > "$RUNNER_TEMP/sjf.log" 2>&1; rc=$?
          python3 - "$W/sjf/control.json" "$rc" "$(( $(date +%s) - t0 ))" <<'PY' | tee -a "$GITHUB_STEP_SUMMARY"
          import json, os, sys
          p, rc, seg = sys.argv[1], sys.argv[2], sys.argv[3]
          if not os.path.exists(p):
              print("SJF: sin control.json. Código", rc)
              sys.exit(1)
          c = json.load(open(p))
          print("SJF", c.get("fecha"), "· estado", c.get("estado"), "· código", rc, "· segundos", seg)
          print("resumen:", json.dumps(c.get("resumen"), ensure_ascii=False))
          for x in (c.get("errores") or [])[:8]:
              print("   error", x.get("tipo"), x.get("paso"), str(x.get("error"))[:160])
          sys.exit(0 if c.get("estado") not in ("EN_CURSO", None) and not c.get("errores") else 1)
          PY
          tail -5 "$RUNNER_TEMP/sjf.log" | cut -c1-200
